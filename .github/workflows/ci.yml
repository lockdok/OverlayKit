name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build OverlayKit.csproj -c Release
      - name: Test
        run: dotnet test tests/OverlayKit.Tests/OverlayKit.Tests.csproj -c Release --no-restore
