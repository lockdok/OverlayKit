name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/OverlayKit.Tests/OverlayKit.Tests.csproj -c Release

      - name: Publish self-contained Windows x64 app
        run: dotnet publish OverlayKit.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Package release
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/OverlayKit.exe")) {
            throw "The published executable was not produced."
          }
          foreach ($file in @("index.html", "app.js", "styles.css")) {
            if (-not (Test-Path "publish/wwwroot/$file")) {
              throw "Required browser-source file is missing: $file"
            }
          }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "publish/OverlayKit.exe" "artifacts/OverlayKit.exe"
          Compress-Archive -Path "publish/*" -DestinationPath "artifacts/OverlayKit-windows-x64.zip" -CompressionLevel Optimal

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "artifacts/OverlayKit-windows-x64.zip" "artifacts/OverlayKit.exe" --repo "$env:GITHUB_REPOSITORY" --title "OverlayKit $env:GITHUB_REF_NAME" --notes "Self-contained Windows x64 release. Download the ZIP for the complete app, or the standalone executable if you already have the wwwroot folder beside it."
